name: Deploy telemetry dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "telemetry/live-web-dashboard/**"
      - ".github/workflows/telemetry_web_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: telemetry-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry/live-web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telemetry/live-web-dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /SentinelBlue/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: telemetry/live-web-dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
